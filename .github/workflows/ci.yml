name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-lint:
    name: Workflow YAML lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install --upgrade pyyaml

      - name: Validate workflow YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in sorted(Path(".github/workflows").glob("*.yml")):
              with path.open("r", encoding="utf-8") as f:
                  yaml.safe_load(f)
              print(f"valid yaml: {path}")
          PY

  backend-ci:
    name: Backend tests and evals
    runs-on: ubuntu-latest
    needs: workflow-lint
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install backend dependencies
        run: |
          uv venv --python 3.12
          uv pip install -r requirements.txt

      - name: Compile Python files
        run: |
          uv run env PYTHONPATH=. python -m py_compile $(find app evaluation tests -name "*.py" -not -path "*/__pycache__/*")

      - name: Check app file sizes
        run: uv run python scripts/check_app_file_sizes.py

      - name: Run focused regression tests
        run: |
          uv run env PYTHONPATH=. pytest -v --tb=short \
            tests/tests/test_service_coverage_guard.py \
            tests/tests/test_booking_details_flow.py \
            tests/tests/test_booking_confirmation_flow.py \
            tests/tests/test_booking_cancellation_flow.py \
            tests/tests/test_config_driven_shortcuts.py \
            tests/tests/test_v25_routing_regression.py \
            tests/tests/test_eval_dataset_schema.py \
            tests/tests/test_eval_scoring.py \
            tests/tests/test_eval_runner_smoke.py \
            tests/tests/test_eval_report_card.py \
            tests/tests/test_cors_config.py

      - name: Run eval report card
        run: |
          uv run env PYTHONPATH=. python evaluation/v2_eval.py \
            --dataset evaluation/golden_set.yaml \
            --json \
            --out evaluation/eval_results/latest.json \
            --ci \
            --fail-under 0.85

      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-card
          path: |
            backend/evaluation/eval_results/latest.json
            backend/evaluation/eval_results/latest.md
          if-no-files-found: warn

  rust-gateway-ci:
    name: Rust gateway
    runs-on: ubuntu-latest
    needs: workflow-lint
    defaults:
      run:
        working-directory: backend/rust_gateway
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend/rust_gateway

      - name: Check formatting
        run: cargo fmt --check

      - name: Cargo check
        run: cargo check

      - name: Cargo test
        run: cargo test
