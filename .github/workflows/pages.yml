name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build site
        env:
          PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R frontend_static/. _site/
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          api_base_url = os.getenv("PUBLIC_API_BASE_URL", "").strip().rstrip("/")
          config = "window.APP_CONFIG = " + json.dumps(
              {"API_BASE_URL": api_base_url},
              indent=2,
          ) + ";\n"
          Path("_site/config.js").write_text(config, encoding="utf-8")
          print("Configured PUBLIC_API_BASE_URL:", api_base_url or "(not configured)")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
