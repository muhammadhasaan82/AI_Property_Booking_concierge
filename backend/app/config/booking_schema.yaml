# app/config/booking_schema.yaml
# ─────────────────────────────────────────────────────────────────────────────
# Schema-driven booking flow.
# Existing keys in agent_config.yaml#booking remain for backward compatibility;
# this file ADDS richer metadata (validators, prompts, ask_order) consumed by
# the policy router (Phase 3) and the structured understanding frame (Phase 2).
#
# To add/remove a booking field: edit this file. No Python changes needed.
# ─────────────────────────────────────────────────────────────────────────────

version: "1.0"

booking:
  # Mirror agent_config.yaml#booking.required_fields — keep these two in sync
  # until Phase 3 migrates booking.py off agent_config.yaml.
  required_fields:
    - property_id
    - property_title
    - guest_name
    - guest_email
    - guest_phone
    - check_in
    - check_out

  required_numeric_fields:
    - guests
    - price_per_night

  # Order in which the policy router asks for missing fields.
  # Property fields (property_id, property_title, price_per_night) are typically
  # populated by select_property; the user is asked for these in order:
  ask_order:
    - guest_name
    - guest_email
    - guest_phone
    - check_in
    - check_out
    - guests

  # User-facing prompts when a field is missing. Edit copy here, not in tools/.
  field_display_names:
    property_id: "Property ID"
    property_title: "Property"
    guest_name: "Full name"
    guest_email: "Email"
    guest_phone: "Phone number"
    check_in: "Check-in date"
    check_out: "Check-out date"
    guests: "Number of guests"
    price_per_night: "Price per night"

  field_prompts:
    guest_name: "What full name should I use for the reservation?"
    guest_email: "What email should I use for your reservation?"
    guest_phone: "What phone number should I use for the reservation?"
    check_in: "What check-in date would you prefer?"
    check_out: "And the check-out date?"
    guests: "How many guests will be staying?"
    property_id: "Could you tell me which property you'd like to book?"
    property_title: "Which property are we booking?"
    price_per_night: "What's the nightly price for this property?"

  # Per-field validators. Used by policy router and review_booking_details.
  validators:
    guest_name:
      type: length
      min: 2
      max: 120
      message: "Please provide the guest's full name."

    guest_email:
      type: regex
      pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
      message: "That doesn't look like a valid email — could you double-check?"

    guest_phone:
      type: regex
      pattern: '^[0-9+\-\s()]{7,20}$'
      message: "That doesn't look like a valid phone number — could you double-check?"

    guests:
      type: integer
      min: 1
      max: 20
      message: "Number of guests must be between 1 and 20."

    price_per_night:
      type: float
      min: 0
      message: "Nightly price must be a non-negative number."

    check_in:
      type: date
      format: "%Y-%m-%d"
      not_before: today
      message: "Check-in date must be today or later."

    check_out:
      type: date
      format: "%Y-%m-%d"
      after_field: check_in
      message: "Check-out cannot be earlier than your check-in date."

  field_aliases:
    guest_name: ["name", "full name", "guest name"]
    guest_email: ["email", "email address", "mail"]
    guest_phone: ["phone", "phone number", "mobile", "mobile number", "contact number", "number"]
    check_in: ["check in", "check-in", "check in date", "check-in date", "arrival", "arrival date"]
    check_out: ["check out", "check-out", "check out date", "check-out date", "departure", "departure date"]
    guests: ["guest", "guests", "people", "persons", "party size"]
    property_id: ["property", "property id"]

  amendable_fields:
    - guest_name
    - guest_email
    - guest_phone
    - check_in
    - check_out
    - guests

  amendment_display_names:
    guest_name: "full name"
    guest_email: "email"
    guest_phone: "phone number"
    check_in: "check-in date"
    check_out: "check-out date"
    guests: "guests"

  amendment_intent_verbs:
    - change
    - update
    - edit
    - modify
    - fix
    - correct

  amendment_context_markers:
    - "this booking"
    - "my booking"
    - "this reservation"
    - "my reservation"
    - "reservation"

  amendment_field_groups:
    dates:
      display_name: "dates"
      fields: [check_in, check_out]
      aliases: ["dates", "booking dates", "stay dates"]

  
  date_format: "%Y-%m-%d"
  source_tag: v2_adk
  confirmed_status: confirmed

  # Booking flow routing, stages, and phrase catalogs (consumed by app/services/booking/)
  flow:
    active_stages:
      - collecting_details
      - awaiting_confirmation
      - awaiting_modification_choice
      - modifying_details
      - awaiting_property_reselection
      - confirmed
      - awaiting_amendment_choice
      - awaiting_amendment_values
      - awaiting_amendment_confirmation
    post_confirmation_amendment_stages:
      - confirmed
      - awaiting_amendment_choice
      - awaiting_amendment_values
      - awaiting_amendment_confirmation
    faq_keywords:
      - pet
      - pets
      - parking
      - cancellation
      - refund
      - policy
      - policies
      - check-in time
      - check in time
      - check-out time
      - check out time
      - smoking
      - wifi
      - amenities
      - payment
      - accessibility
      - allowed
    check_in_date_pattern: '\b(check[- ]?in(?: date)?|arrival(?: date)?)\b'
    check_out_date_pattern: '\b(check[- ]?out(?: date)?|checkout(?: date)?|departure(?: date)?)\b'
    confirmation_yes_tokens: [yes, yeah, sure, confirm, proceed, correct, ok, okay]
    confirmation_no_tokens: [no, nope, nah, reject]
    cancellation_patterns:
      - '\b(delete|cancel|remove)\s+(?:this\s+|my\s+|the\s+)?booking\b'
      - '\b(delete|cancel|remove)\s+(?:this\s+|my\s+|the\s+)?registration\b'
    negated_cancellation_patterns:
      - '\b(?:do\s+not|don''?t|dont)\s+(?:cancel|delete|remove)\b'
      - '\bkeep\s+it\b'
      - '\bnever\s*mind\b'
      - '\bnevermind\b'
      - '\bchange\s+my\s+mind\b'
    status_intent_patterns:
      - '\bmy\s+booking\s+id\s+is\b'
      - '\bbooking\s+id\b'
      - '\bcheck\s+my\s+booking\s+status\b'
      - '\bcheck\s+booking\s+status\b'
      - '\bmy\s+booking\s+status\b'
      - '\bregistration\s+id\b'
      - '\bmy\s+registration\s+id\s+is\b'
      - '\bi\s+want\s+to\s+check\s+my\s+booking\s+status\b'
      - '\bstatus\s+of\s+my\s+booking\b'
      - '\bbooking\s+status\b'
      - '\bmy\s+boking\s+id\s+is\b'
      - '\bboking\s+id\b'
      - '\bcheck\s+my\s+boking\s+status\b'
      - '\bcheck\s+boking\s+status\b'
      - '\bmy\s+boking\s+status\b'
      - '\bi\s+want\s+to\s+check\s+my\s+boking\s+status\b'
      - '\bstatus\s+of\s+my\s+boking\b'
      - '\bboking\s+status\b'
