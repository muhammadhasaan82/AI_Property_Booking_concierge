version: "1.2"

# Phrase/pattern content lives ONLY here. Python is a generic matcher engine.
# requires_state gates each shortcut: it fires only when those soft_state keys
# are present. If nothing matches, the turn falls through to ADK/LLM.
#
# ---------------------------------------------------------------------------
# Generic shortcut schema (all keys are optional except `action`):
#
#   action:           tool action emitted on match (consumed by adk_runner)
#   direction:        optional direction tag (e.g. next/previous)
#   requires_state:   ALL of these soft_state keys must be present and truthy
#   requires_any_state: at least ONE of these soft_state keys must be present
#                      and truthy
#   requires_context: soft_state[key] == value for each (key, value) pair
#   examples:         literal phrases matched on full normalised equality
#   patterns:         regex templates using {number} for entity capture
#   entity_schema:    declares typed entities for pattern capture groups
#   semantic_cues:    generic token-based intent matching (no phrase lists
#                     hardcoded in Python). Shape:
#                       semantic_cues:
#                         any:  - [token, token, ...]   # at least one any
#                         none: - [token, token, ...]   # group must NOT match
#                     A cue "matches" when every token in the group appears
#                     as a token in the normalised message. A shortcut is
#                     considered a semantic-cue match when:
#                       - no "none" group matches, AND
#                       - at least one "any" group matches.
#                     The matcher itself is fully generic; the YAML is the
#                     only source of truth for which cues correspond to which
#                     shortcut intent.
# ---------------------------------------------------------------------------
shortcuts:
  available_cities_request:
    action: list_available_cities
    examples:
      - "in which cities currently the service is available?"
      - "which cities are available?"
      - "what cities do you have available?"
      - "list available cities"
      - "show available cities"

  property_detail_booking_confirmed:
    action: start_booking_for_selected_property
    requires_context:
      last_presented_view: property_details
    requires_any_state:
      - last_selected_property_id
    examples:
      - "yes"
      - "yeah"
      - "yeah sure"
      - "sure"
      - "yes please"
      - "book it"
      - "book this"
      - "book this property"
      - "i want to book this property"
      - "proceed"
      - "continue"
      - "confirm"

  booking_review_confirmed:
    action: confirm_booking_review
    requires_context:
      booking_stage: awaiting_confirmation
    requires_any_state:
      - booking_review
      - pending_booking
    examples:
      - "yes"
      - "confirm"
      - "looks good"
      - "proceed"
      - "book it"
      - "yes please"

  booking_review_modify:
    action: modify_booking_review
    requires_any_state:
      - booking_review
      - pending_booking
    requires_context:
      booking_stage: awaiting_confirmation
    examples:
      - "no"
      - "change name"
      - "update phone"
      - "change dates"
      - "change guests"
      - "change property"

  resume_booking_after_faq:
    action: resume_booking_flow
    requires_state:
      - booking_stage
      - booking_property_id
    examples:
      - "continue booking"
      - "continue booking please"
      - "resume booking"
      - "continue my booking"

  pagination_next:
    action: paginate_results
    direction: next
    requires_state: [all_search_results]
    examples:
      - show me more
      - show more
      - more
      - more options
      - more results
      - next
      - next page
      - see more
      - continue

  pagination_previous:
    action: paginate_results
    direction: previous
    requires_state: [all_search_results]
    examples:
      - previous
      - previous page
      - go back
      - back page
      - prev

  resume_booking_selection:
    action: select_property
    requires_any_state: [option_map, active_property_options_map]
    entity_schema:
      selection_number: integer
    patterns:
      - "option {number}"
      - "select {number}"
      - "choose option {number}"
      - "choose {number}"
      - "book option {number}"
      - "go with {number}"
      - "back to booking option {number}"
      - "{number}"

  property_detail_rejected:
    action: return_to_previous_results
    requires_context:
      last_presented_view: property_details
    requires_any_state:
      - visible_results
      - option_map
      - all_search_results
    examples:
      - "no"
      - no thanks
      - not this one
      - i don't like this one
      - back to menu
      - back to list
      - show me other options
    # Generic token-cue matcher.  This is the source of truth; Python does
    # not hardcode "no not this one" or any other phrase variant.  A message
    # is considered a rejection cue when at least one "any" group has every
    # token present in the normalised text, AND no "none" group does.
    semantic_cues:
      any:
        - ["no"]
        - ["nah"]
        - ["nope"]
        - ["not", "this"]
        - ["not", "one"]
        - ["not", "property"]
        - ["not", "good"]
        - ["do", "not", "want"]
        - ["don't", "want"]
        - ["dont", "want"]
        - ["other", "options"]
        - ["other", "properties"]
        - ["another", "option"]
        - ["another", "property"]
        - ["back", "list"]
        - ["back", "menu"]
        - ["back", "results"]
        - ["different", "one"]
        - ["skip"]
        - ["next", "one"]
      none:
        - ["book"]
        - ["confirm"]
        - ["proceed"]
        - ["yes"]
        - ["sure"]
