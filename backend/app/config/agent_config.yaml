# app/config/agent_config.yaml
# ─────────────────────────────────────────────────────────────────────────────
# Single source of truth for ALL runtime-configurable values used by the
# ADK V2 pipeline.
#
# PHILOSOPHY:
#   The LLM reasoning layer is probabilistic and self-thinking by nature.
#   This file drives the infrastructure AROUND the LLM — every threshold,
#   field list, intent set, fallback message, and limit that was previously
#   hardcoded in Python now lives here.
#
#   To change behaviour: edit this file. No Python changes required.
# ─────────────────────────────────────────────────────────────────────────────

version: "2.0"

# ── Anomaly Detection ───────────────────────────────────────────────────────
# Protects against tool-loop hijacking. A "loop" is defined as repeated calls
# to the same tool with identical parameters within a short time window.
anomaly:
  # Number of identical (tool, params_hash) calls before triggering anomaly
  tool_loop_threshold: 3                         # env: ANOMALY_TOOL_LOOP_THRESHOLD
  # Time window in seconds — only count calls within this window
  time_window_seconds: 30                         # env: ANOMALY_TIME_WINDOW_SECONDS
  # Session TTL for anomaly tracking history
  session_ttl_minutes: 30                         # env: ANOMALY_SESSION_TTL_MINUTES
  # Tools that are safe to repeat without triggering loop protection
  exempt_tools:
    - get_all_available_cities
    - escalate_to_human
  # Graceful fallback message when anomaly is triggered
  fallback_message: >-
    I seem to be having a bit of trouble processing that request.
    Could you try rephrasing or providing a few more details?

# ── Models ──────────────────────────────────────────────────────────────────
# All values below are overridable by environment variables.
# Environment variable wins over this file.
models:
  dispatcher:
    env_key: ADK_DISPATCHER_MODEL
    default: "openai/gpt-5-nano"
    temperature: 0.3

  voice:
    env_key: ADK_VOICE_MODEL
    default: "groq/llama-3.1-8b-instant"
    temperature: 0.6

  pre_router_fast:
    env_key: PRE_ROUTER_FAST_MODEL
    default: "groq/llama-3.1-8b-instant"

  mem0:
    provider_env_key: MEM0_LLM_PROVIDER
    provider_default: groq
    env_key: MEM0_LLM_MODEL
    default: "llama-3.1-8b-instant"

# ── Session ─────────────────────────────────────────────────────────────────
session:
  cache_ttl_seconds: 3600          # env: SOFT_SESSION_CACHE_TTL_SECONDS
  unresolved_turns_fatigued: 1     # env: ENGAGEMENT_FATIGUED_TURNS
  unresolved_turns_exhausted: 3    # env: ENGAGEMENT_EXHAUSTED_TURNS

# ── Property search ─────────────────────────────────────────────────────────
search:
  rerank_limit: 10                 # env: PROPERTY_RERANK_LIMIT
  rerank_timeout_seconds: 0.3      # env: PROPERTY_RERANK_TIMEOUT_SECONDS
  result_limit: 20                 # env: PROPERTY_SEARCH_RESULT_LIMIT

  result_limit_max: 50             # env: PROPERTY_SEARCH_RESULT_LIMIT_MAX
  summary_mode_threshold: 8        # env: PROPERTY_SEARCH_SUMMARY_THRESHOLD
  full_specific_search_when_city_and_property_type: true

search_display:
  mode: all_matching
  sort:
    - field: rating
      direction: desc
      missing_last: true
    - field: reviews_count
      direction: desc
      missing_last: true
    - field: price_per_night
      direction: asc
      missing_last: true
  max_inline_results: null
  pagination_enabled: false
# ── Pagination (display) ────────────────────────────────────────────────────
pagination:
  default_page_size: 5     # env: PROPERTY_LIST_PAGE_SIZE
  max_page_size: 25        # env: PROPERTY_LIST_PAGE_SIZE_MAX
# ── Dataset ─────────────────────────────────────────────────────────────────
dataset:
  relative_path: "data/dataset.csv"   # relative to backend/
  city_column_candidates:
    - city
    - location

# ── Intent routing action sets ───────────────────────────────────────────────
# These are the action_intent values that the triage_router LLM emits.
# The triage_instruction.md prompt describes these values to the LLM.
# If you add a new intent to the prompt, add it here too.

pre_router:
  enabled: true
  max_reply_latency_ms: 3000

  # Fast LLM used to *generate* replies for obvious intents.
  # Detection is deterministic; generation is probabilistic.
  generator:
    model_env_key: PRE_ROUTER_FAST_MODEL
    model_default: "groq/llama-3.1-8b-instant"
    temperature: 0.7
    max_tokens: 80
    timeout_seconds: 4

  # Each intent declares:
  #   match    — deterministic detection rules
  #   role     — what the LLM should *be* (not what it should *say*)
  intents:
    greeting:
      match:
        normalized_exact: [hi, hello, hey, hola, yo, greetings, salam, salaam]
        normalized_starts_with:
          - hi
          - hello
          - hey
          - hola
          - yo
          - good morning
          - good afternoon
          - good evening
          - hi there
          - hello there
      role: |
        You are a warm, concise hotel booking concierge.
        The user just greeted you.
        Acknowledge them naturally in ONE short sentence and gently invite
        them to share a city, dates, or budget.
        Vary your wording every turn. No lists. No markdown. No emojis unless they used one.

    thanks:
      match:
      role: |
        The user thanked you. Reply warmly in ONE short sentence and
        optionally offer further help. Vary your wording.

    goodbye:
      match:
        normalized_exact: [bye, goodbye, see you, ttyl, take care, later]
      role: |
        The user is leaving. Say goodbye warmly in ONE short sentence
        and remind them you're available whenever they want help with a stay.

    affirmation:
      match:
        normalized_exact: ["ok", okay, sure, "yes", yep, yeah, alright, got it, sounds good]
      role: |
        The user gave a short acknowledgement with no new content.
        Reply in ONE short sentence asking what they'd like to do next
        (search a city, see policies, check a booking).
      
    search:
      defer_to_adk: true
      role: |
        You are a hotel booking concierge. Property search results are provided below.
        Present them as a clean numbered list with city, price, beds, and rating.
        If no results, suggest broadening filters. Be warm and concise.

    empty_or_unclear:
      role: |
        The user's message is empty or unintelligible.
        Politely ask them in ONE short sentence to share what they need:
        a city, dates, budget, a policy question, or a booking ID.
        
  out_of_scope:
      match:
        normalized_contains_any:
          - write code
          - write a code
          - python code
          - javascript
          - sql
          - calculate
          - solve this
          - what is 2
          - 2 plus 2
          - tell me a joke
          - tell joke
          - weather in
          - whats the weather
          - what is the weather
          - explain quantum
          - who is the president
          - latest news
          - stock price
          - sports score
          - translate
          - homework
          - my essay
          - write an essay
          - write me a poem
          - recipe for
          - how to cook
          - medical advice
          - legal advice
          - investment advice
      role: |
        You are an AI HOTEL BOOKING CONCIERGE. The user asked something outside
        your scope (programming, math, general knowledge, news, weather, jokes,
        recipes, advice, etc.).

        Politely decline in ONE short sentence and gently redirect them back to
        what you CAN help with: searching properties, booking a stay, checking
        a booking status, or answering hotel-policy questions.

        - Do not solve the request.
        - Do not write code.
        - Do not give the answer.
        - Be warm and varied in wording.
        - No lists, no markdown, no code blocks.

  # Final safety net — used only if the fast LLM call fails or times out.
  emergency_fallback: "I'm here — could you share what you need (city, dates, budget, or a booking question)?"

intent_routing:
  history_action_intents:
    - re_evaluate_history
    - explore_previous_results
    - previous_results
    - show_previous_results
    - show_previous
    - revisit_results

  new_search_action_intents:
    - new_search
    - fresh_search

# ── Booking ─────────────────────────────────────────────────────────────────
booking:
  date_format: "%Y-%m-%d"

  # Fields required for both review_booking_details and process_v2_booking.
  # Order matters for validation output. Add or remove fields without touching Python.
  required_fields:
    - property_id
    - property_title
    - guest_name
    - guest_email
    - guest_phone
    - check_in
    - check_out
  # Numeric fields validated separately (coerced from LLM output):
  required_numeric_fields:
    - guests
    - price_per_night

  # Fields and copy for deterministic "book this selected property" handoff.
  # These are user-facing collection fields; property_id/title/price are filled
  # from the selected property context when available.
  details_request_fields:
    - guest_name
    - guest_email
    - guest_phone
    - check_in
    - check_out
    - guests
  details_request_prompt_template: |
    Great - I'll help you book {property_title}.
    Please provide:
    {missing_fields_bullets}

  review_prompt_template: |
    Please review your booking details for {property_title}:
    - Full name: {guest_name}
    - Email: {guest_email}
    - Phone: {guest_phone}
    - Check-in: {check_in}
    - Check-out: {check_out}
    - Guests: {guests}
    - Nights: {nights}
    - Price per night: {price_per_night}
    - Total: {total}

    Please confirm if everything is correct.

  modification_prompt_template: |
    What would you like to change: name, email, phone, guests, check-in date, check-out date, or property?

  validation_checkout_after_checkin_template: |
    Your check-out date cannot be earlier than your check-in date. Please provide a valid check-out date after {check_in_display}.

  validation_capacity_template: |
    This property can host up to {occupancy_max} guests. Please provide a guest count within that limit.

  faq_resume_prompt: "Would you like to continue your booking?"
  receipt_prompt_template: |
    Your booking is confirmed.
    - Registration ID: {registration_id}
    - Property: {property_title}
    - Full name: {guest_name}
    - Email: {guest_email}
    - Phone: {guest_phone}
    - Check-in: {check_in}
    - Check-out: {check_out}
    - Guests: {guests}
    - Nights: {nights}
    - Price per night: {price_per_night}
    - Total: {total}
    - Status: {booking_status}

    You can use your registration ID to check your booking status.

  # Template for deterministic booking status lookup when the receipt is found in session
  booking_status_prompt_template: |
    Here are your booking details:
    - Registration ID: {registration_id}
    - Property: {property_title}
    - Full name: {guest_name}
    - Email: {guest_email}
    - Phone: {guest_phone}
    - Check-in: {check_in}
    - Check-out: {check_out}
    - Guests: {guests}
    - Nights: {nights}
    - Price per night: {price_per_night}
    - Total: {total_amount}
    - Status: {booking_status}

  # Template shown when a booking ID was provided but not found in session or DB
  booking_status_not_found_template: |
    It looks like your booking wasn't found in our system. Please double-check your registration ID and try again, or contact our support team for assistance.

  # Template shown when the user asks for booking status but has no ID and no receipt
  booking_status_ask_for_id_template: |
    I'd be happy to check your booking status. Could you share your registration ID? It looks like BK-YYYYMMDD-XXXXXXXX and was shown when you confirmed your booking.

  registration_id_prefix: "BK"

  booking_source_tag: "v2_adk"     # written to DB — change without Python edits
  booking_confirmed_status: "confirmed"

# ── FAQ interruption / resume ───────────────────────────────────────────────
faq_interruption:
  state_key: faq_interruption
  source: faq
  reply_joiner: "\n\n"
  prompts:
    property_menu: >-
      Would you like to continue with the property list you were viewing, or ask another policy question?
    selected_property: >-
      Would you like to go back to that property, continue booking it, or ask another policy question?
    booking_flow: >-
      Would you like to continue your booking? You can also ask another policy question.
    fallback: >-
      Would you like to continue where you left off, or ask another policy question?
  resume_cues:
    exact:
      - "yes"
      - "sure"
      - "continue"
      - "go back"
      - "back to list"
      - "resume"
      - "return"
      - "yes please"
      - "continue booking"
      - "continue please"
    semantic_cues:
      any:
        - ["yes"]
        - ["sure"]
        - ["continue"]
        - ["resume"]
        - ["return"]
        - ["go", "back"]
        - ["back", "list"]
        - ["yes", "please"]
        - ["continue", "booking"]
      none:
        - ["policy"]
        - ["refund"]
        - ["deposit"]
        - ["cancellation"]
        - ["check", "in"]
        - ["check", "out"]

# ── Small talk message types ─────────────────────────────────────────────────
# Valid values the triage_router may pass to handle_small_talk.
small_talk:
  valid_types:
    - greeting
    - thanks
    - goodbye
    - acknowledgement
    - out_of_scope
  default_type: acknowledgement

# ── Engagement states ────────────────────────────────────────────────────────
# Valid engagement state labels. Must match what the triage prompt describes.
engagement:
  valid_states:
    - engaged
    - fatigued
    - exhausted_or_frustrated

# ── Property resolution intent classes ───────────────────────────────────────
# Valid intent classes the property resolver LLM may output.
# Must match the strict_output_schema in prompts/resolution_prompt.md.
resolution:
  valid_intent_classes:
    - select_property
    - general_inquiry
    - modify_search
    - confirm_booking
    - escalate
  fallback_intent: select_property

# ── Fallback messages ────────────────────────────────────────────────────────
# User-facing copy for unresolved states. Edit here — no Python changes.
messages:
  resolution_unresolved_default: >-
    I couldn't confidently match that to one of the current options yet,
    so a quick detail like the price, rating, or option number would help me lock it in.

  resolution_unresolved_frustrated: >-
    I couldn't confidently match that to one of the current options.
    Reply with the number you want, or say reset and I'll start fresh.

  resolution_not_matched_log: >-
    The reference could not be mapped to a single active option with sufficient confidence.

  selection_out_of_range: >-
    That option number is outside the current shortlist. Choose one of the listed options,
    or refine your search.
  all_results_already_shown: >-
    All matching properties are already shown.
  pipeline_timeout_fallback: >-
    I'm taking a bit longer than usual on that. Could you try once more?
  escalation_default_reason: "User requested assistance."

# ── Status string identifiers ────────────────────────────────────────────────
# Written into tool payloads. The concierge_voice reads 'status' to decide response.
# Changing a value here changes it everywhere simultaneously.
status:
  missing_critical_data: missing_critical_data
  error: error
  cities_found: cities_found
  properties_found: properties_found
  no_results: no_results
  property_details: property_details
  property_selection_unresolved: property_selection_unresolved
  not_found: not_found
  casual_interaction: casual_interaction
  answered: answered
  faq_not_found: faq_not_found
  gathering_info: gathering_info
  review_pending: review_pending
  amendment_acknowledged: amendment_acknowledged
  booking_confirmed: booking_confirmed
  found: found
  booking_not_found: booking_not_found
  handoff_required: handoff_required

# ── Source provenance tags ────────────────────────────────────────────────────
sources:
  memory: memory
  policy_db: policy_database
  rag: rag_pipeline
  basic_faq: basic_faq
  v2_adk: v2_adk

#───Feature Flags───────────────────────────────────────────────────────────────────────────
features:
  understanding_frame_enabled: true
  policy_router_mode: "shadow"
  response_policies_enabled: true
  tool_registry_enabled: true


#───Runtime Limits────────────────────────────────────────────────────────────────
runtime_limits:
  max_adk_events_per_turn: 8
  turn_timeout_seconds: 90
  routing_limit_fallback: >-
    I'm having trouble routing that quickly. Could you rephrase with the city,
    dates, or booking question?

# ── Property type taxonomy source ────────────────────────────────────────────
# The taxonomy YAML is the single source of truth. This block controls
# the loader path only.
property_type_taxonomy:
  config_file: "property_type_taxonomy.yaml"  # relative to app/config/
  unknown_type_policy: pass_through             # pass_through | strict
