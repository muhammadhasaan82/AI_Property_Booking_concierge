version: "2.0"

defaults:
  tags: []
  initial_soft_state: {}
  expected:
    tool: null
    intent: null
    args: {}
    response_contains: []
    response_not_contains:
      - "Beverly Hills"
      - "Pacific Palisades"
      - "Santa Monica"
    state_assertions: {}
  scoring:
    weights:
      routing: 0.20
      args: 0.20
      state: 0.20
      response: 0.30
      safety: 0.10
    pass_threshold: 0.80
    strict: false

